<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img">
  <title>EasySQL loading</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <style>
    .stem, .arm-top, .arm-mid, .arm-bot { fill: #FFFFFF; }
    .arm-top { animation: arm-glow 1.8s ease-in-out infinite; }
    .arm-mid { animation: arm-glow 1.8s ease-in-out infinite; animation-delay: 0.18s; }
    .arm-bot { animation: arm-glow 1.8s ease-in-out infinite; animation-delay: 0.36s; }
    @keyframes arm-glow {
      0%, 100% { opacity: 1; }
      40% { opacity: 0.7; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arm-top, .arm-mid, .arm-bot { animation: none; }
    }
  </style>
  <g transform="translate(20 20) scale(0.7777778) translate(-4 -4)">
    <rect x="4" y="4" width="72" height="72" rx="16" fill="url(#brand)"/>
    <rect class="stem" x="29.0752" y="23.9941" width="7.584" height="32.0118"/>
    <rect class="arm-top" x="36.6592" y="23.9941" width="14.6308" height="6.1875"/>
    <rect class="arm-mid" x="36.6592" y="36.7988" width="13.4707" height="6.0586"/>
    <rect class="arm-bot" x="36.6592" y="49.8184" width="14.6094" height="6.1875"/>
  </g>
</svg>