<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 8" width="200" height="8" role="img">
  <title>EasySQL loading</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <style>
    .indicator {
      animation: bar-slide 1.4s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }
    @keyframes bar-slide {
      from { transform: translateX(-128px); }
      to { transform: translateX(128px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .indicator { animation: none; }
    }
  </style>
  <rect x="0" y="0" width="200" height="8" rx="4" fill="#F1F5F9" fill-opacity="0.14"/>
  <rect class="indicator" x="72" y="0" width="56" height="8" rx="4" fill="url(#brand)"/>
</svg>