<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 20" width="60" height="20" role="img">
  <title>EasySQL loading</title>
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="6" y1="4" x2="54" y2="16">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <style>
    .dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: dot-pulse 1.2s ease-in-out infinite;
    }
    .dot-2 { animation-delay: 0.12s; }
    .dot-3 { animation-delay: 0.24s; }
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      35% { transform: scale(0.68); opacity: 0.5; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
  <circle class="dot" cx="12" cy="10" r="6" fill="url(#brand)"/>
  <circle class="dot dot-2" cx="30" cy="10" r="6" fill="url(#brand)"/>
  <circle class="dot dot-3" cx="48" cy="10" r="6" fill="url(#brand)"/>
</svg>